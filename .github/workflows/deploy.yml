name: Déploiement du site

on:
  push:
    branches: [claude/academie-voltige-style-x4qbuv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # SITE COMPLET EN LIGNE (phase de test grandeur nature).
      # Pour remettre la page d'attente : rétablir l'assemblage
      # « construction/. → _site » avec le miroir /builder/site/
      # (voir l'historique git de ce fichier, PR #15).
      - name: Assemble le site complet et l'éditeur
        run: |
          mkdir -p _site/builder
          cp -r assets *.html sitemap.xml _site/
          cp -r builder/. _site/builder/
          printf 'User-agent: *\nAllow: /\nDisallow: /builder/\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
