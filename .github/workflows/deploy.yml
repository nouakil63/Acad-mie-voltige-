name: Déploiement du site

on:
  push:
    branches: [claude/academie-voltige-style-x4qbuv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Site en construction : la page d'attente est publiée à la racine,
      # l'éditeur visuel sur /builder/, et une copie du vrai site sous
      # /builder/site/ (non référencée, exclue des moteurs) pour que
      # l'éditeur puisse charger les pages et les photos.
      # Pour mettre le site complet en ligne : remplacer l'assemblage
      # ci-dessous par « path: . » dans upload-pages-artifact.
      - name: Assemble la page d'attente et l'éditeur
        run: |
          mkdir -p _site/builder/site
          cp -r construction/. _site/
          cp -r builder/. _site/builder/
          cp -r assets *.html _site/builder/site/
          printf 'User-agent: *\nAllow: /\nDisallow: /builder/\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
