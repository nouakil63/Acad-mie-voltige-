name: Déploiement du site

on:
  push:
    branches: [claude/academie-voltige-style-x4qbuv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Site complet en ligne : le dépôt est publié tel quel — les pages
      # à la racine, l'éditeur visuel sur /builder/ (il lit désormais les
      # pages à la racine du site), et le robots.txt du dépôt exclut
      # /builder/ et /design/ des moteurs. La page d'attente reste
      # disponible dans construction/ si besoin de revenir en arrière.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
