<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3F0">
  <title>Feuille de présence — Académie de voltige équestre</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="stylesheet" href="../assets/css/fonts.css?v=30">
  <style>
    :root{--rouge:#D00828;--encre:#1D1216;--gris:#73666c;--trait:#e9e1df;--voile:#F7F3F0;--surface:#fff}
    *{box-sizing:border-box;margin:0}
    [hidden]{display:none!important}
    body{font-family:'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif;color:var(--encre);background:var(--voile);padding:28px clamp(20px,4vw,50px) 48px;line-height:1.5;-webkit-font-smoothing:antialiased}
    :where(a,button,[tabindex]):focus-visible{outline:3px solid var(--rouge);outline-offset:3px}
    .barre{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1140px;margin:0 auto 24px}
    .barre a,.barre button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:12px 20px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--encre);font:700 14px/1.3 'Hanken Grotesk',sans-serif;cursor:pointer;text-decoration:none;touch-action:manipulation}
    .barre button{border-color:var(--rouge);background:var(--rouge);color:#fff}
    .barre a:hover{background:var(--surface)}.barre button:hover{background:#A5081F;border-color:#A5081F}
    .barre svg{width:18px;height:18px;flex-shrink:0}
    main{max-width:1140px;min-width:0;margin:0 auto;padding:36px 40px;background:var(--surface);border:1px solid var(--trait);border-radius:20px;box-shadow:0 8px 32px rgba(29,18,22,.035)}
    header{display:flex;align-items:flex-start;gap:18px;padding-bottom:26px;border-bottom:1px solid var(--trait)}
    header>div{min-width:0}header img{width:56px;height:56px;flex-shrink:0;border-radius:16px}
    h1{font-family:'Bricolage Grotesque','Hanken Grotesk',sans-serif;font-weight:700;font-stretch:92%;font-size:clamp(24px,2.5vw,30px);line-height:1.2;letter-spacing:-.025em;overflow-wrap:anywhere}
    .contexte{font-size:16px;font-weight:650;line-height:1.5;margin-top:10px;overflow-wrap:anywhere}
    .sous{color:var(--gris);font-size:14px;margin-top:5px;overflow-wrap:anywhere}.sous:empty{display:none}
    .infos{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;margin:20px 0 24px;font-size:12px;color:var(--gris)}
    .table-guide{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gris);margin:0 0 12px}
    .table-guide svg{width:16px;height:16px;flex-shrink:0}
    .table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-color:#c6b9bd var(--voile);scrollbar-width:thin;border:1px solid var(--trait);border-radius:14px;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{font-size:12px;font-weight:650;color:var(--gris);text-align:left;padding:16px 14px;border-bottom:1px solid var(--trait);background:#fbf9f7;white-space:nowrap}
    td{padding:18px 14px;border-bottom:1px solid var(--trait);vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    td.num{color:var(--gris);width:40px;font-size:12px}
    td.nom{font-weight:700;min-width:130px;overflow-wrap:anywhere}
    td.info{color:var(--gris);font-size:12.5px;min-width:130px;overflow-wrap:anywhere}
    td.coche{text-align:center;width:64px;min-width:48px}
    td.coche::before{content:"";display:inline-block;width:19px;height:19px;border:1.4px solid #a6989f;border-radius:5px;vertical-align:middle}
    .pied{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:12px;color:var(--gris)}
    .signature{display:flex;align-items:flex-end;min-height:112px;padding:20px;background:#fbf9f7;border:1px solid var(--trait);border-radius:14px}
    .signature span{width:100%;border-top:1px solid #b9abb1;padding-top:8px}
    .vide{margin:28px 0;padding:32px 24px;text-align:center;color:var(--gris);background:var(--voile);border-radius:14px;font-size:14px}
    @media(max-width:600px){
      body{padding:0 max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
      .barre{position:sticky;top:0;z-index:2;gap:8px;margin:0 -2px;padding:calc(12px + env(safe-area-inset-top)) 0 16px;background:var(--voile)}
      .barre a,.barre button{padding:11px 12px;font-size:13px;border-radius:12px}
      main{padding:24px 18px;border-radius:20px;box-shadow:none}
      header{gap:12px;padding-bottom:22px}header img{width:40px;height:40px;border-radius:12px}h1{font-size:24px}
      .contexte{font-size:14px;margin-top:8px}.sous{font-size:13px}
      .infos{display:grid;gap:5px;margin:18px 0 22px}.pied{grid-template-columns:1fr;gap:12px}.signature{min-height:94px;padding:18px}
      th{padding:14px 12px}td{padding:16px 12px}.vide{padding:28px 18px}
    }
    @media print{
      .barre,.table-guide{display:none!important}body{padding:10mm;background:#fff}
      main{padding:0;max-width:none;border:0;border-radius:0;box-shadow:none}header{padding-bottom:16px}h1{font-size:24px}.contexte{font-size:14px}
      .table-scroll{overflow:visible;border:0;border-radius:0;max-width:none}table{min-width:0!important;font-size:12px}
      th,td{padding:9px 6px}td.nom,td.info,td.coche{min-width:0}td.coche{width:42px}th{background:#fff}td.coche::before{border-color:var(--encre);border-radius:0}
      tr{break-inside:avoid}.pied{display:flex;justify-content:space-between;gap:30px;break-inside:avoid}.signature{min-height:90px;padding:0;width:230px;max-width:100%;border:0;border-radius:0;background:#fff}.signature span{border-color:var(--encre)}
    }
  </style>
</head>
<body>
  <nav class="barre" aria-label="Actions de la feuille de présence">
    <a id="f-retour" href="./#reservations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg><span>Retour au planning</span></a>
    <button type="button" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 14h10v7H7z"/></svg><span>Imprimer</span></button>
  </nav>
  <main aria-labelledby="f-titre">
  <header>
    <img src="../assets/img/logo.jpeg" alt="">
    <div>
      <h1 id="f-titre">Feuille de présence</h1>
      <p class="contexte" id="f-contexte" hidden></p>
      <div class="sous" id="f-sous"></div>
    </div>
  </header>
  <div class="infos">
    <span>Académie de voltige équestre · Auberville</span>
    <span id="f-edition"></span>
  </div>
  <p id="f-table-guide" class="table-guide" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 8-4 4 4 4m10-8 4 4-4 4M3 12h18"/></svg><span>Glissez pour voir toutes les colonnes.</span></p>
  <div id="f-table-scroll" class="table-scroll" role="region" aria-label="Tableau des présences" hidden>
    <table id="f-table" aria-labelledby="f-titre" hidden>
      <thead><tr id="f-entetes"></tr></thead>
      <tbody id="f-lignes"></tbody>
    </table>
  </div>
  <p class="vide" id="f-vide" hidden>Aucun voltigeur sur cette feuille.</p>
  <div class="pied">
    <div class="signature"><span>Signature de l'encadrant</span></div>
    <div class="signature"><span>Observations</span></div>
  </div>
  </main>
<script>
(function () {
  'use strict';
  var f = null;
  try { f = JSON.parse(localStorage.getItem('av:feuille')); } catch (e) { /* rien */ }
  if (!f) {
    document.getElementById('f-vide').hidden = false;
    document.getElementById('f-vide').textContent = 'Cette page s’ouvre depuis l’espace académie (bouton « Feuille de présence »).';
    return;
  }
  if (typeof f.retour === 'string' && /^#(?:reservations|accueil)(?:\/(?:cours|stage)\/[^\s]+)?$/.test(f.retour)) {
    document.getElementById('f-retour').href = './' + f.retour.replace(/^#accueil/, '#reservations');
  }
  var contexte = String(f.titre || '').replace(/^Feuille de pr[ée]sence\s*(?:[·—–:-]\s*)?/i, '').trim();
  document.getElementById('f-contexte').textContent = contexte;
  document.getElementById('f-contexte').hidden = !contexte;
  document.getElementById('f-sous').textContent = f.sousTitre || '';
  document.getElementById('f-edition').textContent = 'Éditée le ' + new Date().toLocaleDateString('fr-FR');
  document.title = (f.titre || 'Feuille de présence') + ' — Académie de voltige';

  var colonnes = f.colonnes && f.colonnes.length ? f.colonnes : ['Présent'];
  var entetes = document.getElementById('f-entetes');
  ['#', 'Voltigeur', 'Contact'].concat(colonnes).forEach(function (c) {
    var th = document.createElement('th');
    th.textContent = c;
    th.scope = 'col';
    entetes.appendChild(th);
  });

  var corps = document.getElementById('f-lignes');
  var lignes = f.lignes || [];
  if (!lignes.length) {
    document.getElementById('f-vide').hidden = false;
    return;
  }
  document.getElementById('f-table').hidden = false;
  document.getElementById('f-table').style.minWidth = Math.max(520, 310 + colonnes.length * 64) + 'px';
  var rail = document.getElementById('f-table-scroll');
  var guide = document.getElementById('f-table-guide');
  rail.hidden = false;
  lignes.forEach(function (l, i) {
    var tr = document.createElement('tr');
    var num = document.createElement('td'); num.className = 'num'; num.textContent = String(i + 1); tr.appendChild(num);
    var nom = document.createElement('td'); nom.className = 'nom'; nom.textContent = l.nom || ''; tr.appendChild(nom);
    var info = document.createElement('td'); info.className = 'info'; info.textContent = l.info || ''; tr.appendChild(info);
    colonnes.forEach(function () {
      var c = document.createElement('td'); c.className = 'coche'; tr.appendChild(c);
    });
    corps.appendChild(tr);
  });
  function adapterDefilement() {
    var deborde = rail.scrollWidth > rail.clientWidth + 1;
    guide.hidden = !deborde;
    if (deborde) { rail.tabIndex = 0; rail.setAttribute('aria-describedby', 'f-table-guide'); }
    else { rail.removeAttribute('tabindex'); rail.removeAttribute('aria-describedby'); }
  }
  adapterDefilement();
  window.addEventListener('resize', adapterDefilement);
  if (window.ResizeObserver) { new ResizeObserver(adapterDefilement).observe(rail); }
})();
</script>
</body>
</html>
